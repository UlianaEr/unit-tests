name: build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore tests/Orders.Tests/Orders.Tests.csproj

    - name: Build
      run: dotnet build tests/Orders.Tests/Orders.Tests.csproj --no-restore --configuration Release

    - name: Test
      run: dotnet test tests/Orders.Tests/Orders.Tests.csproj --no-build --configuration Release --verbosity normal
