name: build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Находим основной проект и проект с тестами напрямую
    - name: Find Projects
      run: |
        echo "SRC_PROJECT=$(find . -name 'Orders.csproj' -print -quit)" » $GITHUB_ENV
        echo "TEST_PROJECT=$(find . -name 'Orders.Tests.csproj' -print -quit)" » $GITHUB_ENV

    - name: Show found projects
      run: |
        echo "Main project: $SRC_PROJECT"
        echo "Test project: $TEST_PROJECT"

    - name: Restore test dependencies
      run: dotnet restore "$TEST_PROJECT"

    - name: Build main project
      run: dotnet build "$SRC_PROJECT" --configuration Release

    - name: Test project
      run: dotnet test "$TEST_PROJECT" --configuration Release --verbosity normal
