name: build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Находим абсолютно все файлы .csproj в репозитории
    - name: Find all projects
      run: |
        echo "PROJECTS=$(find . -name '*.csproj' | tr '\n' ' ')" » $GITHUB_ENV
        echo "Найдены проекты: $PROJECTS"

    # Восстанавливаем зависимости для всех найденных проектов сразу
    - name: Restore all
      run: |
        for proj in $PROJECTS; do
          dotnet restore "$proj"
        done

    # Собираем и запускаем тесты (dotnet test сам соберет зависимости)
    - name: Test
      run: dotnet test --configuration Release --verbosity normal
