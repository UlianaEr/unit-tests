name: build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Этот шаг автоматически найдет файл .sln в любой папке
    - name: Find Solution File
      run: echo "SOLUTION_FILE=$(find . -name '*.sln' -print -quit)" » $GITHUB_ENV

    - name: Show found solution
      run: echo "Found solution file at $SOLUTION_FILE"

    - name: Restore dependencies
      run: dotnet restore "$SOLUTION_FILE"

    - name: Build
      run: dotnet build "$SOLUTION_FILE" --no-restore --configuration Release

    - name: Test
      run: dotnet test "$SOLUTION_FILE" --no-build --configuration Release --verbosity normal
