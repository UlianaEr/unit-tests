name: build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Ищем файл тестового проекта на любой глубине
    - name: Find Test Project
      run: echo "TEST_PROJECT=$(find . -name 'Orders.Tests.csproj' -print -quit)" » $GITHUB_ENV

    - name: Show found path
      run: echo "Тесты лежат тут -> $TEST_PROJECT"

    - name: Restore dependencies
      run: dotnet restore "$TEST_PROJECT"

    - name: Build
      run: dotnet build "$TEST_PROJECT" --no-restore --configuration Release

    - name: Test
      run: dotnet test "$TEST_PROJECT" --no-build --configuration Release --verbosity normal
