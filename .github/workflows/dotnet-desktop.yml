name: build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Find Projects
      run: |
        echo "MAIN_PROJECT=$(find . -name 'Orders.csproj' -print -quit)" » $GITHUB_ENV
        echo "TEST_PROJECT=$(find . -name 'Orders.Tests.csproj' -print -quit)" » $GITHUB_ENV

    # Принудительно восстанавливаем и собираем основной проект
    - name: Restore Main
      run: dotnet restore "$MAIN_PROJECT"

    - name: Build Main
      run: dotnet build "$MAIN_PROJECT" --no-restore --configuration Release

    # Теперь восстанавливаем тесты (они подхватят уже собранный основной проект)
    - name: Restore Tests
      run: dotnet restore "$TEST_PROJECT"

    - name: Test
      run: dotnet test "$TEST_PROJECT" --configuration Release --verbosity normal
